services:
  - type: web
    name: scholara
    env: python
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract